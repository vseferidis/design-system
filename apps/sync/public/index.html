<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design System Sync</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg-card: #1a1d27;
      --bg-hover: #22253a;
      --border: #2a2d3e;
      --border-subtle: #1e2130;
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --text-dim: #4b5563;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --radius: 8px;
      --radius-sm: 4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    button {
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      font-weight: 500;
      transition: background 120ms ease, color 120ms ease, opacity 120ms ease;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }

    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

    .setup-banner {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .setup-banner.hidden { display: none; }
    .setup-icon { font-size: 20px; margin-top: 2px; }
    .setup-content { flex: 1; }
    .setup-content h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .setup-content p { color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }
    .setup-input-row { display: flex; gap: 8px; }
    .setup-input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 7px 12px;
      font-size: 13px;
      font-family: monospace;
    }
    .setup-input-row input::placeholder { color: var(--text-dim); }
    .setup-input-row input:focus { outline: none; border-color: var(--accent); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

    .component-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .component-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .component-header:hover { background: var(--bg-hover); }

    .component-tag {
      font-family: monospace;
      font-size: 12px;
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-hover);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }

    .component-name { font-weight: 600; flex: 1; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .status-dot.synced { background: var(--green); }
    .status-dot.diffs { background: var(--yellow); }
    .status-dot.checking { background: var(--accent); animation: pulse 1s ease infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .component-body { border-top: 1px solid var(--border); }
    .component-body.hidden { display: none; }

    .check-area {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .diff-container { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

    .screenshot-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .screenshot-pane {
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .screenshot-pane-label {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }

    .screenshot-pane img {
      width: 100%;
      display: block;
    }

    .screenshot-placeholder {
      padding: 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
    }

    .diff-list { display: flex; flex-direction: column; gap: 1px; }

    .diff-group-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 12px 0 6px;
    }
    .diff-group-label:first-child { margin-top: 0; }

    .diff-row {
      display: grid;
      grid-template-columns: 220px 1fr 1fr 80px;
      gap: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 2px;
    }

    .diff-cell {
      padding: 10px 14px;
      font-size: 13px;
      border-right: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .diff-cell:last-child { border-right: none; }

    .diff-prop {
      font-family: monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .diff-val-code { color: var(--text-muted); }
    .diff-val-figma { color: var(--text); }

    .diff-swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .diff-actions { justify-content: center; gap: 6px; }

    .btn-accept {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      padding: 4px 10px;
      font-size: 12px;
    }
    .btn-accept:hover { background: rgba(16, 185, 129, 0.25); }
    .btn-accept.active {
      background: var(--green);
      color: white;
    }

    .btn-reject {
      background: rgba(239, 68, 68, 0.1);
      color: var(--red);
      padding: 4px 10px;
      font-size: 12px;
    }
    .btn-reject:hover { background: rgba(239, 68, 68, 0.2); }
    .btn-reject.active {
      background: var(--red);
      color: white;
    }

    .tag-new {
      font-size: 10px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--yellow);
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 600;
    }

    .diff-footer {
      padding: 16px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
    }

    .diff-summary { color: var(--text-muted); font-size: 13px; }
    .diff-summary strong { color: var(--text); }

    .no-diffs {
      padding: 24px;
      text-align: center;
      color: var(--green);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 100;
      transform: translateY(80px);
      opacity: 0;
      transition: transform 300ms ease, opacity 300ms ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }
    .toast a { color: var(--accent-hover); }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">⚡</div>
      Design System Sync
    </div>
    <div class="header-actions">
      <span id="figma-key-display" style="font-family:monospace;font-size:12px;color:var(--text-muted)"></span>
    </div>
  </header>

  <main>
    <!-- Setup banner -->
    <div class="setup-banner" id="setup-banner">
      <div class="setup-icon">🔑</div>
      <div class="setup-content">
        <h3>Connect your Figma file</h3>
        <p>Paste the Figma file key — it's the string in the URL between <code>/design/</code> and the next <code>/</code>.<br>
           e.g. <code>figma.com/design/<strong>aBcDeFgHiJ...</strong>/My-File</code></p>
        <div class="setup-input-row">
          <input type="text" id="figma-key-input" placeholder="aBcDeFgHiJkL..." autocomplete="off" spellcheck="false">
          <button class="btn-primary" onclick="saveFileKey()">Save</button>
        </div>
      </div>
    </div>

    <div class="section-header">
      <span class="section-title">Components</span>
    </div>

    <div id="components-list"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
